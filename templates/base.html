<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SPK Polusi Udara DKI Jakarta{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans text-[15px] leading-relaxed antialiased">

<div class="min-h-screen flex flex-col lg:flex-row">
    <!-- Sidebar Navigasi -->
    <aside class="w-full lg:w-64 bg-slate-900 text-slate-200 flex-shrink-0">
        <div class="px-6 py-7 border-b border-slate-800">
            <h1 class="text-lg font-bold text-white tracking-tight">SPK Polusi Udara</h1>
            <p class="text-sm text-slate-400 mt-1">Provinsi DKI Jakarta</p>
        </div>

        <nav class="p-4 flex flex-wrap lg:flex-col gap-1.5">
            <a href="{{ url_for('dashboard') }}"
               class="px-4 py-3 rounded-lg text-[15px] font-medium transition {{ 'bg-teal-600 text-white font-semibold' if active_page == 'dashboard' else 'text-slate-300 hover:bg-slate-800 hover:text-white' }}">
                Dashboard
            </a>
            <a href="{{ url_for('data_wilayah') }}"
               class="px-4 py-3 rounded-lg text-[15px] font-medium transition {{ 'bg-teal-600 text-white font-semibold' if active_page == 'data' else 'text-slate-300 hover:bg-slate-800 hover:text-white' }}">
                Data Wilayah
            </a>
            <a href="{{ url_for('pembobotan_ahp') }}"
               class="px-4 py-3 rounded-lg text-[15px] font-medium transition {{ 'bg-teal-600 text-white font-semibold' if active_page == 'ahp' else 'text-slate-300 hover:bg-slate-800 hover:text-white' }}">
                Pembobotan AHP
            </a>
            <a href="{{ url_for('hasil_keputusan') }}"
               class="px-4 py-3 rounded-lg text-[15px] font-medium transition {{ 'bg-teal-600 text-white font-semibold' if active_page == 'keputusan' else 'text-slate-300 hover:bg-slate-800 hover:text-white' }}">
                Hasil Keputusan
            </a>
            <a href="{{ url_for('detail_perhitungan') }}"
               class="px-4 py-3 rounded-lg text-[15px] font-medium transition {{ 'bg-teal-600 text-white font-semibold' if active_page == 'perhitungan' else 'text-slate-300 hover:bg-slate-800 hover:text-white' }}">
                Detail Perhitungan
            </a>
        </nav>
    </aside>

    <!-- Area Konten Utama -->
    <main class="flex-1 px-6 py-8 lg:px-12 lg:py-10 max-w-6xl">
        {% if message %}
        <div class="mb-6 px-5 py-3.5 rounded-lg bg-teal-50 border border-teal-200 text-teal-900 font-medium">
            {{ message }}
        </div>
        {% endif %}

        {% if error_msg %}
        <div class="mb-6 px-5 py-3.5 rounded-lg bg-red-50 border border-red-200 text-red-900 font-medium">
            {{ error_msg }}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</div>

{% block scripts %}{% endblock %}
</body>
</html>
